<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reset Your Password | Robayer WealthLab</title>
  <meta name="description" content="Get a link to set or reset the password for your Robayer WealthLab account.">
  <link rel="canonical" href="https://robayerwealthlab.com/checkout/forgot-password/">
  <meta name="robots" content="noindex, nofollow">

  <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,600;1,500&family=Space+Grotesk:wght@500&family=Work+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/tokens.css?v=167327e0c9">
  <link rel="stylesheet" href="/css/base.css?v=57a963bc6f">
  <link rel="stylesheet" href="/css/layout.css?v=a6fb0c7359">
  <link rel="stylesheet" href="/css/components.css?v=1afe806636">
  <link rel="stylesheet" href="/css/utilities.css?v=406dfe7300">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <div data-include="/partials/header.html"></div>

  <main id="main-content">
    <section class="section" aria-labelledby="forgot-password-heading">
      <div class="container content-column">
        <span class="eyebrow text-center">Your account</span>
        <h1 id="forgot-password-heading" class="mt-2 mb-2 text-center">Reset your password</h1>
        <p class="text-secondary text-center mb-5">
          Enter the email you purchased with. If it has an account,
          we'll send a link to set or reset your password.
        </p>

        <form class="card" style="max-width:420px;margin:0 auto;padding:var(--space-5);" data-forgot-password-form novalidate aria-label="Reset your password">
          <div class="field">
            <label for="forgot-password-email" class="field__label">Email address</label>
            <input type="email" id="forgot-password-email" name="email" class="field__input" autocomplete="email" required>
          </div>
          <button type="submit" class="btn btn--accent" style="width:100%;margin-bottom:var(--space-3);">Send link</button>
          <p class="text-secondary text-small text-center">
            Never set a password because your purchase predates
            accounts? <a href="/checkout/claim-purchase/">Recover your purchase</a> instead.
          </p>
        </form>
      </div>
    </section>
  </main>

  <div data-include="/partials/footer.html"></div>

  <script src="/js/includes.js?v=cba95d9aa1"></script>
  <script src="/js/components/nav.js?v=c2889cbb06"></script>
  <script src="/js/components/theme-toggle.js?v=eebe98960c"></script>
  <script src="/js/components/branding.js?v=483b048741"></script>
  <script src="/js/content-inject.js?v=10a4d215c2"></script>
  <script src="/js/components/forgot-password-form.js?v=7caeb62844"></script>
  <script src="/js/main.js?v=b2c3d4e6f1"></script>
</body>
</html>
