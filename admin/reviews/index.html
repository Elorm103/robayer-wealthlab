<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reviews | Robayer WealthLab Admin</title>
  <meta name="description" content="Moderate customer product reviews.">
  <link rel="canonical" href="https://robayerwealthlab.com/admin/reviews/">
  <meta name="robots" content="noindex, nofollow">

  <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,600;1,500&family=Space+Grotesk:wght@500&family=Work+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/utilities.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <div class="admin-shell" data-sidebar-collapsed="false">
    <div class="admin-include" data-include="/partials/admin-sidebar.html"></div>

    <div class="admin-main">
      <div class="admin-include" data-include="/partials/admin-topbar.html"></div>

      <main class="admin-content" id="main-content" data-reviews-root>
        <p class="alert alert--error" role="alert" data-reviews-load-error hidden></p>
        <p class="alert alert--success" role="status" data-reviews-action-success hidden></p>

        <div class="toolbar">
          <div class="toolbar__group">
            <span class="text-small text-secondary" data-reviews-result-count></span>
          </div>
        </div>

        <div class="media-filters" role="group" aria-label="Status filters" data-reviews-status-filters>
          <button type="button" class="media-filter-chip" aria-pressed="true" data-reviews-status-filter="">All</button>
          <button type="button" class="media-filter-chip" aria-pressed="false" data-reviews-status-filter="pending">Pending</button>
          <button type="button" class="media-filter-chip" aria-pressed="false" data-reviews-status-filter="approved">Approved</button>
          <button type="button" class="media-filter-chip" aria-pressed="false" data-reviews-status-filter="rejected">Rejected</button>
        </div>

        <div class="empty-state" data-reviews-empty hidden>
          <svg class="icon empty-state__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l3 6.5 7 1-5 5 1.3 7-6.3-3.5L5.7 21.5 7 14.5l-5-5 7-1z"/></svg>
          <p class="empty-state__title" data-reviews-empty-title>No reviews yet</p>
          <p class="empty-state__body" data-reviews-empty-body>Reviews submitted by customers with a verified purchase will appear here for moderation.</p>
        </div>

        <div class="admin-table-wrap" data-reviews-table-wrap hidden>
          <table class="table" aria-label="Product reviews">
            <thead>
              <tr>
                <th scope="col">Product</th>
                <th scope="col">Reviewer</th>
                <th scope="col">Rating</th>
                <th scope="col">Review</th>
                <th scope="col">Status</th>
                <th scope="col">Submitted</th>
                <th scope="col">Actions</th>
              </tr>
            </thead>
            <tbody data-reviews-table-body></tbody>
          </table>
        </div>

        <div class="pagination" data-reviews-pagination>
          <span data-reviews-pagination-label></span>
          <div class="pagination__controls">
            <button type="button" class="pagination__button" data-reviews-pagination-prev aria-label="Previous page">
              <svg class="icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <button type="button" class="pagination__button" data-reviews-pagination-next aria-label="Next page">
              <svg class="icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
            </button>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/js/includes.js"></script>
  <script src="/js/components/theme-toggle.js"></script>
  <script src="/js/components/admin/admin-auth.js"></script>
  <script src="/js/components/admin/admin-shell.js"></script>
  <script src="/js/components/admin/admin-reviews.js"></script>
</body>
</html>
